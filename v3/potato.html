<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감자 깎기 2</title>
<!-- Widget Web JS 위젯 필수: 위젯 제목 -->
<meta name="js-widget-title" content="감자 깎기 2">

<style>
  :root {
    --bg: #fff4dc;
    --ink: #4a3220;
    --sub: #9a7b5c;
    --dot-off: #e8d3b0;
    --dot-on: #c98a3c;
    --gold: #f2b53c;
  }
  * { box-sizing: border-box; }

  /* ── 위젯 네모: 페이지 맨 위. 작은 위젯 = 정사각형, ?size=medium = 가로로 긴 것 ──
     Widget Web 26은 페이지를 폰 화면 크기로 그리고 빨간 틀로 잘라 쓴다.
     실제 위젯 크기로 그려져도 네모가 화면에 꽉 차도록 min()을 쓴다. */
  :root { --a: 1; }
  html.medium { --a: 2.14; }
  html {
    --w: min(100vw, calc(100vh * var(--a)));
    --h: calc(var(--w) / var(--a));
  }
  html, body { margin: 0; background: #1c1c1e; -webkit-tap-highlight-color: transparent; }
  body { min-height: 100vh; }
  .widget {
    width: var(--w);
    height: var(--h);
    position: relative;
    overflow: hidden;
    container-type: size;
  }
  .outside {
    padding: 22px 20px;
    text-align: center;
    color: #8e8e93;
    font: 600 15px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  .outside b { color: #f2f2f7; }

  .widget {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1cqh;
    padding: 4cqh 4cqw;
  }
  /* 감자 전체가 하나의 누르는 곳 */
  .potato-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    flex: 0 0 auto;
    --wweb2-overlay-btn-color: rgba(0, 0, 0, 0.0);
    --wweb2-overlay-btn-press-color: rgba(120, 70, 20, 0.18);
    --wweb2-overlay-btn-corner-radius: 30%;
    --wweb2-overlay-btn-padding: -4%;
  }
  .potato-btn svg { width: min(78cqw, 52cqh); height: auto; display: block; }
  .dots { display: flex; gap: 2.4cqw; margin-top: 0.6cqh; }
  .dot { width: 3.6cqw; height: 3.6cqw; border-radius: 50%; background: var(--dot-off); }
  .dot.on { background: var(--dot-on); }

  .money { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .money .label, .money .hint { display: none; }
  .money .amount {
    font-size: 13cqw;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .money .amount small { font-size: 0.45em; font-weight: 700; margin-left: 0.1em; }

  /* 업그레이드 표시 (감자 공방이 켠 것): 작은 위젯은 왼쪽 위 스티커 */
  .tags { position: absolute; top: 6cqw; left: 6cqw; display: flex; gap: 2cqw; }
  .tag {
    display: inline-flex;
    align-items: center;
    padding: 0.18em 0.62em 0.2em;
    border-radius: 999px;
    background: #3b2616;
    color: var(--gold);
    font-size: 6.6cqw;
    font-weight: 800;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  /* 중간(가로로 긴) 위젯 */
  html.medium .widget { flex-direction: row; gap: 4cqw; padding: 3cqh 5cqw; }
  html.medium .potato-btn svg { width: min(46cqw, 78cqh); }
  html.medium .dots { gap: 1.6cqw; margin-top: 1.5cqh; }
  html.medium .dot { width: 2.2cqw; height: 2.2cqw; }
  html.medium .money { align-items: flex-start; }
  html.medium .money .label {
    display: block;
    font-size: 3.6cqw;
    color: var(--sub);
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  html.medium .money .amount { font-size: 12cqw; }
  html.medium .money .hint {
    display: block;
    margin-top: 0.6cqh;
    font-size: 3.4cqw;
    color: var(--sub);
    font-weight: 600;
    min-height: 1.3em;
  }
  html.medium .money .hint.earned { color: #d0731c; font-weight: 800; }
  html.medium .tags { position: static; margin-top: 1.2cqh; gap: 1.4cqw; min-height: 1.6em; }
  html.medium .tag { font-size: 3.1cqw; }
</style>

<script>
  // ?size=medium 이면 가로로 긴 위젯 모양
  if (/[?&]size=medium\b/.test(location.search)) document.documentElement.className = "medium";
</script>

<script>
  // ── Widget Web 연동: 준비되면 바로 찍어 달라고 알림 ──
  function __wweb2WaitMillisecondsToWidgetIsReady(currentDelayMs) {
    return 0;
  }

  // ── 쿠키 (같은 주소의 위젯들이 함께 씀) ──
  function readCookie(name) {
    var m = document.cookie.match(new RegExp("(?:^|;\\s*)" + name + "=([^;]*)"));
    return m ? decodeURIComponent(m[1]) : null;
  }
  function writeCookie(name, value) {
    document.cookie = name + "=" + encodeURIComponent(value) + "; max-age=315360000; path=/";
  }

  // 감자 상태: 면 4개(0 껍질, 1 반쯤, 2 다 깜), 정면, 돈, 누른 횟수, 방금 번 돈
  function loadPotato() {
    var v = readCookie("potato2");
    if (v) {
      var p = v.split("|");
      if (p.length === 5) {
        var faces = p[0].split(",").map(function (x) { return parseInt(x, 10) || 0; });
        if (faces.length === 4) {
          return {
            faces: faces,
            angle: parseInt(p[1], 10) || 0,
            money: parseInt(p[2], 10) || 0,
            taps: parseInt(p[3], 10) || 0,
            flash: parseInt(p[4], 10) || 0
          };
        }
      }
    }
    // 처음: 예전 감자 위젯에서 모은 돈을 이어받는다
    var money = 0;
    var old = readCookie("potato");
    if (old) {
      var q = old.split("|");
      if (q.length === 5) money = parseInt(q[2], 10) || 0;
    }
    return { faces: [0, 0, 0, 0], angle: 0, money: money, taps: 0, flash: 0 };
  }
  function savePotato(s) {
    writeCookie("potato2", [s.faces.join(","), s.angle, s.money, s.taps, s.flash].join("|"));
  }

  // 업그레이드 상태 (업그레이드 위젯이 씀, 여기선 읽기만)
  function loadUpgrade() {
    var u = { dbl: 0, rw: 1, armed: 0, taps: 0 };
    var v = readCookie("upgrade2");
    if (v) {
      var p = v.split("|");
      if (p.length === 4) {
        u.dbl = p[0] === "1" ? 1 : 0;
        u.rw = Math.max(1, Math.min(9, parseInt(p[1], 10) || 1));
        u.armed = p[2] === "1" ? 1 : 0;
        u.taps = parseInt(p[3], 10) || 0;
      }
    }
    return u;
  }

  var state = loadPotato();

  // ── 한 번 톡: 정면 껍질 벗기고(업그레이드면 두 겹), 다음 깔 곳으로 돌림 ──
  function peel() {
    var up = loadUpgrade();
    state.taps += 1;
    state.flash = 0;
    state.faces[state.angle] = Math.min(2, state.faces[state.angle] + (up.dbl ? 2 : 1));

    var done = state.faces.every(function (f) { return f >= 2; });
    if (done) {
      state.money += up.rw;
      state.flash = up.rw;
      state.faces = [0, 0, 0, 0];
      state.angle = 0;
    } else {
      for (var i = 1; i <= 4; i++) {
        var next = (state.angle + i) % 4;
        if (state.faces[next] < 2) { state.angle = next; break; }
      }
    }
    savePotato(state);
  }

  // ── 위젯에서 눌렸을 때: #action=peel&n=… (n은 두 번 깎임 방지) ──
  (function handleWidgetTap() {
    var params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    if (params.get("action") === "peel" && parseInt(params.get("n"), 10) === state.taps) {
      peel();
    }
  })();
</script>
</head>

<body>
<div class="widget">
  <a class="potato-btn" id="potato" href="#action=peel&n=0">
    <svg id="art" viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" aria-label="감자"></svg>
    <div class="dots" id="dots"></div>
  </a>

  <div class="money">
    <div class="label">모은 돈</div>
    <div class="amount" id="amount">0<small>원</small></div>
    <div class="hint" id="hint">톡 눌러서 까기</div>
    <div class="tags" id="tags"></div>
  </div>
</div>

  <div class="outside">↑ 위 네모가 위젯이에요.<br><b>빨간 틀을 네모에 딱 맞춰 주세요.</b></div>

<script>
  var SKIN = "#a8713f", SKIN_DARK = "#8b5a2f", FLESH = "#f6dd8f", FLESH_DARK = "#e9c86b";

  var EYES = [
    [[82, 70], [118, 98], [95, 118]],
    [[110, 66], [88, 96], [116, 122]],
    [[96, 62], [122, 84], [84, 110]],
    [[86, 84], [112, 64], [104, 112]]
  ];

  function faceFill(st, id) {
    if (st === 2) return FLESH;
    if (st === 1) return "url(#half-" + id + ")";
    return SKIN;
  }

  function bodyPath() {
    return "M62 36 C86 18 136 20 162 40 C184 58 188 100 168 124 " +
           "C148 148 92 154 58 140 C30 128 16 96 26 68 C32 52 46 44 62 36 Z";
  }

  function draw() {
    var f = state.faces, a = state.angle;
    var left = (a + 3) % 4, right = (a + 1) % 4;

    var svg = "<defs>";
    ["L", "C", "R"].forEach(function (id) {
      svg += '<pattern id="half-' + id + '" width="46" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(' + (id === "C" ? 12 : -20) + ')">' +
             '<rect width="46" height="40" fill="' + FLESH + '"/>' +
             '<path d="M2 4 C10 0 22 2 24 9 C26 16 14 19 7 16 C0 13 -2 7 2 4 Z" fill="' + SKIN + '"/>' +
             '<path d="M28 20 C36 17 45 21 44 28 C43 34 32 35 28 31 C24 27 23 22 28 20 Z" fill="' + SKIN + '"/>' +
             '<path d="M6 27 C10 25 16 27 15 31 C14 35 8 36 5 33 C3 31 3 28 6 27 Z" fill="' + SKIN + '"/>' +
             '</pattern>';
    });
    svg += '<clipPath id="body"><path d="' + bodyPath() + '"/></clipPath>';
    svg += '<radialGradient id="shade" cx="38%" cy="30%" r="75%">' +
           '<stop offset="0" stop-color="#fff" stop-opacity="0.45"/>' +
           '<stop offset="0.45" stop-color="#fff" stop-opacity="0"/>' +
           '<stop offset="1" stop-color="#3a1f08" stop-opacity="0.38"/>' +
           '</radialGradient>';
    svg += '</defs>';

    svg += '<ellipse cx="100" cy="152" rx="62" ry="9" fill="#3a1f08" opacity="0.13"/>';

    var TILT = [-6, 5, -2, 8];
    svg += '<g transform="rotate(' + TILT[a] + ' 100 88)">';
    svg += '<g clip-path="url(#body)">';
    svg += '<rect x="0" y="0" width="100" height="170" fill="' + faceFill(f[left], "L") + '"/>';
    svg += '<rect x="100" y="0" width="100" height="170" fill="' + faceFill(f[right], "R") + '"/>';
    svg += '<ellipse cx="100" cy="88" rx="46" ry="60" fill="' + faceFill(f[a], "C") + '"/>';
    if (f[a] < 2) {
      EYES[a].forEach(function (p) {
        svg += '<ellipse cx="' + p[0] + '" cy="' + p[1] + '" rx="3.2" ry="2.2" fill="' + SKIN_DARK + '" opacity="' + (f[a] === 1 ? 0.55 : 1) + '"/>';
      });
    }
    svg += '<rect x="0" y="0" width="200" height="170" fill="url(#shade)"/>';
    svg += '</g>';
    svg += '<path d="' + bodyPath() + '" fill="none" stroke="' + (f.every(function (x) { return x === 2; }) ? FLESH_DARK : SKIN_DARK) + '" stroke-width="2.2"/>';
    svg += '</g>';
    document.getElementById("art").innerHTML = svg;

    // 진행 점 8개 (껍질 8겹)
    var peeled = f.reduce(function (s, x) { return s + x; }, 0);
    var dots = "";
    for (var i = 0; i < 8; i++) dots += '<span class="dot' + (i < peeled ? " on" : "") + '"></span>';
    document.getElementById("dots").innerHTML = dots;

    // 돈
    document.getElementById("amount").innerHTML = state.money.toLocaleString("ko-KR") + "<small>원</small>";
    var up = loadUpgrade();
    var hint = document.getElementById("hint");
    if (state.flash) {
      hint.textContent = "+" + state.flash + "원! 새 감자";
      hint.className = "hint earned";
    } else {
      var step = up.dbl ? 2 : 1;
      var tapsLeft = f.reduce(function (s, x) { return s + Math.ceil((2 - x) / step); }, 0);
      hint.textContent = peeled === 0 ? "톡 눌러서 까기" : tapsLeft + "번 남음";
      hint.className = "hint";
    }

    // 업그레이드 표시
    var tags = "";
    if (up.dbl) tags += '<span class="tag">×2</span>';
    if (up.rw > 1) tags += '<span class="tag">+' + up.rw + '원</span>';
    document.getElementById("tags").innerHTML = tags;

    document.getElementById("potato").setAttribute("href", "#action=peel&n=" + state.taps);
  }

  // 브라우저에서 직접 누를 때 (위젯이 아닐 때)
  document.getElementById("potato").addEventListener("click", function (e) {
    e.preventDefault();
    peel();
    draw();
  });

  draw();
</script>
</body>
</html>
